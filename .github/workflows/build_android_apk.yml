name: Build Android APK

on:
  push:
    branches: [v1.18.2]
    paths:
      - app/**
      - packages/**
      - Cargo.toml
      - Cargo.lock
      - pubspec.yaml
      - pubspec.lock
      - rust-toolchain.toml
      - .fvmrc
      - .github/workflows/build_android_apk.yml
  workflow_dispatch:
    inputs:
      split_per_abi:
        description: "按 CPU 架构拆分 APK (默认生成通用 APK)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Read build version
        id: version
        run: |
          VERSION=$(sed -n 's/^version: //p' app/pubspec.yaml)
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false

      - name: Install pinned Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Install pinned Rust toolchain
        run: |
          TOOLCHAIN=$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)
          test -n "$TOOLCHAIN"
          rustup toolchain install "$TOOLCHAIN" --profile minimal
          rustup target add --toolchain "$TOOLCHAIN" \
            aarch64-linux-android armv7-linux-androideabi x86_64-linux-android

      - name: Prepare APK signing
        id: signing
        env:
          ANDROID_KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
          ANDROID_KEY_STORE: ${{ secrets.ANDROID_KEY_STORE }}
        run: |
          umask 077
          KEYSTORE_PATH="$RUNNER_TEMP/localsend-signing.jks"
          if [[ -n "$ANDROID_KEY_PROPERTIES" && -n "$ANDROID_KEY_STORE" ]]; then
            printf '%s' "$ANDROID_KEY_PROPERTIES" | base64 --decode > app/android/key.properties
            printf '%s' "$ANDROID_KEY_STORE" | base64 --decode > "$KEYSTORE_PATH"
            # 统一密钥路径, 不依赖上游构建目录.
            printf '\nstoreFile=%s\n' "$KEYSTORE_PATH" >> app/android/key.properties
            SIGNING_MODE=release
          elif [[ -n "$ANDROID_KEY_PROPERTIES" || -n "$ANDROID_KEY_STORE" ]]; then
            echo "::error::ANDROID_KEY_PROPERTIES 和 ANDROID_KEY_STORE 必须同时配置."
            exit 1
          else
            # 临时签名仅用于试装. 固定签名请通过仓库 Secrets 配置.
            SIGNING_PASSWORD=$(openssl rand -hex 32)
            echo "::add-mask::$SIGNING_PASSWORD"
            export SIGNING_PASSWORD
            keytool -genkeypair -noprompt -keystore "$KEYSTORE_PATH" \
              -storetype JKS -alias localsend-test -keyalg RSA -keysize 2048 \
              -validity 3650 -dname "CN=LocalSend Test Build" \
              -storepass:env SIGNING_PASSWORD -keypass:env SIGNING_PASSWORD
            printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=localsend-test\nkeyPassword=%s\n' \
              "$KEYSTORE_PATH" "$SIGNING_PASSWORD" "$SIGNING_PASSWORD" > app/android/key.properties
            SIGNING_MODE=test
            echo "::warning::此 APK 使用临时测试签名, 无法覆盖官方版本或其他运行生成的 APK."
          fi
          echo "mode=$SIGNING_MODE" >> "$GITHUB_OUTPUT"

      - name: Remove proprietary dependencies
        run: sh support/scripts/remove_proprietary_dependencies.sh

      - name: Resolve Dart dependencies
        run: |
          flutter pub get
          cd packages/localsend_isolates/rust_builder/cargokit/build_tool
          flutter pub get

      - name: Build release APK
        working-directory: app
        env:
          SPLIT_PER_ABI: ${{ inputs.split_per_abi || false }}
        run: |
          BUILD_ARGS=(--release)
          if [[ "$SPLIT_PER_ABI" == "true" ]]; then
            BUILD_ARGS+=(--split-per-abi)
          fi
          flutter build apk "${BUILD_ARGS[@]}"

      - name: Verify and collect APKs
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SHORT_SHA: ${{ steps.version.outputs.short_sha }}
          SIGNING_MODE: ${{ steps.signing.outputs.mode }}
        run: |
          mkdir -p artifacts
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          test -n "$BUILD_TOOLS"
          shopt -s nullglob
          APKS=(app/build/app/outputs/flutter-apk/*-release.apk)
          if [[ ${#APKS[@]} -eq 0 ]]; then
            echo "::error::未生成 APK."
            exit 1
          fi
          for APK in "${APKS[@]}"; do
            "$BUILD_TOOLS/apksigner" verify --verbose "$APK"
            ABI=$(basename "$APK" .apk)
            ABI=${ABI#app-}
            ABI=${ABI%-release}
            if [[ "$ABI" == "release" ]]; then ABI=universal; fi
            cp "$APK" "artifacts/LocalSend-${VERSION}-${SHORT_SHA}-${ABI}-${SIGNING_MODE}.apk"
          done
          (cd artifacts && sha256sum ./*.apk > SHA256SUMS.txt)
          {
            echo "## LocalSend APK"
            echo "- Version: $VERSION"
            echo "- Commit: $GITHUB_SHA"
            echo "- Signing: $SIGNING_MODE"
            echo "- Download: this run's Artifacts section"
            if [[ "$SIGNING_MODE" == "test" ]]; then
              echo "- 临时测试签名无法覆盖官方 APK 或其他运行的 APK. 稳定更新需要配置固定签名 Secrets."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APKs
        uses: actions/upload-artifact@v6
        with:
          name: LocalSend-${{ steps.version.outputs.version }}-${{ steps.version.outputs.short_sha }}-${{ steps.signing.outputs.mode }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Clean up signing files
        if: always()
        run: rm -f app/android/key.properties "$RUNNER_TEMP/localsend-signing.jks"
